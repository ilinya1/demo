# 前端：Deployment + ClusterIP Service（对外由 Ingress 暴露）
# 镜像内含 nginx + default.conf，其 /api 与 /uploads 反代到 http://backend:8080（同 namespace service 名 backend）。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dorm
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      # imagePullSecrets:
      #   - name: regcred   # 私有 ACR 仓库启用
      containers:
        - name: frontend
          image: registry.cn-hangzhou.aliyuncs.com/your-ns/dorm-frontend:latest
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: dorm
spec:
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 80