# MySQL：PVC + 单副本 Deployment + ClusterIP Service
# init.sql 通过 ConfigMap dorm-init-sql（见 deploy.md 的 kubectl create configmap 命令）
# 挂到 /docker-entrypoint-initdb.d/，首次启动自动建库+种子；PVC 持久化。
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: dorm
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: dorm
spec:
  replicas: 1
  selector:
    matchLabels: { app: mysql }
  template:
    metadata:
      labels: { app: mysql }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_general_ci
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: dorm-secret, key: MYSQL_ROOT_PASSWORD }
            - name: MYSQL_DATABASE
              value: dorm_manager
          ports: [{ containerPort: 3306 }]
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              # init.sql 挂到启动初始化目录，仅首次建库时执行
            - name: init
              mountPath: /docker-entrypoint-initdb.d/01-init.sql
              subPath: 01-init.sql
              readOnly: true
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mysql-data }
        - name: init
          configMap:
            name: dorm-init-sql
            items:
              - key: "01-init.sql"
                path: "01-init.sql"
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: dorm
spec:
  selector: { app: mysql }
  ports:
    - port: 3306
      targetPort: 3306