<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卫生检查登记 — 学生宿舍管理系统</title>
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">
                <span class="icon">宿</span>
                <span class="text">宿舍管理系统</span>
            </div>
            <nav class="menu">
                <div class="menu-title">概览</div>
                <a class="menu-item" href="dashboard.html"><span class="menu-icon">📊</span><span class="menu-text">仪表盘</span></a>
                <div class="menu-title">基础数据</div>
                <a class="menu-item" href="student-list.html"><span class="menu-icon">👨‍🎓</span><span class="menu-text">学生管理</span></a>
                <a class="menu-item" href="building-list.html"><span class="menu-icon">🏢</span><span class="menu-text">楼栋管理</span></a>
                <a class="menu-item" href="room-list.html"><span class="menu-icon">🚪</span><span class="menu-text">房间管理</span></a>
                <div class="menu-title">住宿业务</div>
                <a class="menu-item" href="checkin.html"><span class="menu-icon">📝</span><span class="menu-text">入住登记</span></a>
                <a class="menu-item" href="checkout.html"><span class="menu-icon">📤</span><span class="menu-text">退宿登记</span></a>
                <a class="menu-item" href="checkin-record.html"><span class="menu-icon">📋</span><span class="menu-text">入住记录</span></a>
                <div class="menu-title">日常管理</div>
                <a class="menu-item" href="hygiene-list.html"><span class="menu-icon">🧹</span><span class="menu-text">卫生检查</span></a>
                <a class="menu-item" href="repair-list.html"><span class="menu-icon">🔧</span><span class="menu-text">报修管理</span></a>
                <div class="menu-title">统计报表</div>
                <a class="menu-item" href="stat-occupancy.html"><span class="menu-icon">📈</span><span class="menu-text">入住统计</span></a>
                <a class="menu-item" href="stat-hygiene.html"><span class="menu-icon">📊</span><span class="menu-text">卫生统计</span></a>
                <a class="menu-item" href="stat-repair.html"><span class="menu-icon">📉</span><span class="menu-text">报修统计</span></a>
            </nav>
        </aside>
        <div class="main">
            <header class="header">
                <div class="page-title">卫生检查登记</div>
                <div class="user-info">
                    <span class="role-tag">管理员</span>
                    <span class="username">张宿管</span>
                    <span class="avatar">张</span>
                    <a href="password.html" class="btn btn-sm">修改密码</a>
                    <a href="login.html" class="btn btn-sm">退出</a>
                </div>
            </header>
            <div class="content">
                <div class="card">
                    <div class="card-title">卫生检查登记</div>
                    <div class="form-row">
                        <div class="form-item">
                            <label><span class="required">*</span>检查日期</label>
                            <input type="date" value="2026-09-02">
                        </div>
                        <div class="form-item">
                            <label><span class="required">*</span>检查人</label>
                            <input type="text" value="张宿管">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-item">
                            <label><span class="required">*</span>所属楼栋</label>
                            <select>
                                <option selected>1号楼</option>
                                <option>2号楼</option>
                                <option>3号楼</option>
                            </select>
                        </div>
                        <div class="form-item">
                            <label><span class="required">*</span>房间号</label>
                            <select>
                                <option>101</option>
                                <option selected>102</option>
                                <option>103</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-item">
                            <label><span class="required">*</span>评分（0-100）</label>
                            <input type="number" min="0" max="100" value="85">
                        </div>
                        <div class="form-item">
                            <label><span class="required">*</span>检查结果</label>
                            <select>
                                <option>优秀</option>
                                <option selected>合格</option>
                                <option>不合格</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-item">
                        <label>扣分项</label>
                        <div style="display: flex; flex-wrap: wrap; gap: 12px;">
                            <label style="display: flex; align-items: center; gap: 4px;">
                                <input type="checkbox"> 地面不干净
                            </label>
                            <label style="display: flex; align-items: center; gap: 4px;">
                                <input type="checkbox"> 桌面杂乱
                            </label>
                            <label style="display: flex; align-items: center; gap: 4px;">
                                <input type="checkbox"> 垃圾未倒
                            </label>
                            <label style="display: flex; align-items: center; gap: 4px;">
                                <input type="checkbox"> 被子未叠
                            </label>
                            <label style="display: flex; align-items: center; gap: 4px;">
                                <input type="checkbox"> 违规电器
                            </label>
                        </div>
                    </div>
                    <div class="form-item">
                        <label>评语</label>
                        <textarea rows="3" placeholder="请输入检查评语">整体良好，桌面稍乱</textarea>
                    </div>
                    <div style="text-align: right; margin-top: 20px;">
                        <button class="btn" onclick="location.href='hygiene-list.html'">取消</button>
                        <button class="btn btn-primary" onclick="showMsg('检查记录保存成功（原型））')">保存</button>
                        <button class="btn btn-success" onclick="showMsg('检查记录已保存并发布（原型））')">保存并发布</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/common.js"></script>
</body>
</html>
