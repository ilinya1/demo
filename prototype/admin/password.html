<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 — 学生宿舍管理系统</title>
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">
                <span class="icon">宿</span>
                <span class="text">宿舍管理系统</span>
            </div>
            <nav class="menu">
                <div class="menu-title">概览</div>
                <a class="menu-item" href="dashboard.html"><span class="menu-icon">📊</span><span class="menu-text">仪表盘</span></a>
                <div class="menu-title">基础数据</div>
                <a class="menu-item" href="student-list.html"><span class="menu-icon">👨‍🎓</span><span class="menu-text">学生管理</span></a>
                <a class="menu-item" href="building-list.html"><span class="menu-icon">🏢</span><span class="menu-text">楼栋管理</span></a>
                <a class="menu-item" href="room-list.html"><span class="menu-icon">🚪</span><span class="menu-text">房间管理</span></a>
                <div class="menu-title">住宿业务</div>
                <a class="menu-item" href="checkin.html"><span class="menu-icon">📝</span><span class="menu-text">入住登记</span></a>
                <a class="menu-item" href="checkout.html"><span class="menu-icon">📤</span><span class="menu-text">退宿登记</span></a>
                <a class="menu-item" href="checkin-record.html"><span class="menu-icon">📋</span><span class="menu-text">入住记录</span></a>
                <div class="menu-title">日常管理</div>
                <a class="menu-item" href="hygiene-list.html"><span class="menu-icon">🧹</span><span class="menu-text">卫生检查</span></a>
                <a class="menu-item" href="repair-list.html"><span class="menu-icon">🔧</span><span class="menu-text">报修管理</span></a>
                <div class="menu-title">统计报表</div>
                <a class="menu-item" href="stat-occupancy.html"><span class="menu-icon">📈</span><span class="menu-text">入住统计</span></a>
                <a class="menu-item" href="stat-hygiene.html"><span class="menu-icon">📊</span><span class="menu-text">卫生统计</span></a>
                <a class="menu-item" href="stat-repair.html"><span class="menu-icon">📉</span><span class="menu-text">报修统计</span></a>
            </nav>
        </aside>
        <div class="main">
            <header class="header">
                <div class="page-title">修改密码</div>
                <div class="user-info">
                    <span class="role-tag">管理员</span>
                    <span class="username">张宿管</span>
                    <span class="avatar">张</span>
                    <a href="password.html" class="btn btn-sm active" style="background:#ecf5ff; color:#409eff; border-color:#d9ecff;">修改密码</a>
                    <a href="login.html" class="btn btn-sm">退出</a>
                </div>
            </header>
            <div class="content">
                <div class="card" style="max-width:520px;">
                    <div class="card-title">修改密码</div>
                    <div id="errorMsg" style="display:none; background:#fef0f0; border:1px solid #fde2e2; color:#f56c6c; border-radius:5px; padding:10px 12px; font-size:13px; margin-bottom:16px;">
                        ⚠️ <span id="errorText"></span>
                    </div>
                    <div id="successMsg" style="display:none; background:#f0f9eb; border:1px solid #e1f3d8; color:#67c23a; border-radius:5px; padding:10px 12px; font-size:13px; margin-bottom:16px;">
                        ✅ 密码修改成功，即将跳转到登录页面...
                    </div>
                    <div class="form-item">
                        <label><span class="required">*</span>原密码</label>
                        <input type="password" id="oldPwd" placeholder="请输入原密码">
                    </div>
                    <div class="form-item">
                        <label><span class="required">*</span>新密码</label>
                        <input type="password" id="newPwd" placeholder="请输入新密码（6-20位）">
                    </div>
                    <div class="form-item">
                        <label><span class="required">*</span>确认新密码</label>
                        <input type="password" id="confirmPwd" placeholder="请再次输入新密码">
                    </div>
                    <div style="text-align: right; margin-top: 20px;">
                        <button class="btn" onclick="location.href='dashboard.html'">取消</button>
                        <button class="btn btn-primary" onclick="doChangePwd()">确认修改</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/common.js"></script>
    <script>
        function doChangePwd() {
            var oldP = document.getElementById('oldPwd').value.trim();
            var newP = document.getElementById('newPwd').value.trim();
            var confirmP = document.getElementById('confirmPwd').value.trim();
            var errBox = document.getElementById('errorMsg');
            var errText = document.getElementById('errorText');
            var succBox = document.getElementById('successMsg');
            errBox.style.display = 'none';
            succBox.style.display = 'none';
            if (!oldP || !newP || !confirmP) {
                errText.textContent = '请填写完整的密码信息';
                errBox.style.display = 'block';
                return;
            }
            if (oldP !== '123456') {
                errText.textContent = '原密码错误，请重新输入';
                errBox.style.display = 'block';
                return;
            }
            if (newP.length < 6 || newP.length > 20) {
                errText.textContent = '新密码长度应为6-20位';
                errBox.style.display = 'block';
                return;
            }
            if (newP !== confirmP) {
                errText.textContent = '两次输入的新密码不一致';
                errBox.style.display = 'block';
                return;
            }
            succBox.style.display = 'block';
            setTimeout(function () { window.location.href = 'login.html'; }, 1500);
        }
    </script>
</body>
</html>
