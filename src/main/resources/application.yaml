spring:
  application:
    name: dorm-manager
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/dorm_manager?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

server:
  port: 8080
  servlet:
    context-path: /api          # 与前端 baseURL `/api` 对齐，Controller 映射在 /api 之下

# JWT 鉴权配置（生产请通过环境变量 JWT_SECRET 覆盖为强密钥）
jwt:
  secret: ${JWT_SECRET:dorm-manager-jwt-secret-key-C0mplex-2026!@#AbcD}
  expire-minutes: ${JWT_EXPIRE_MINUTES:720}            # token 有效期（分钟）

mybatis-plus:
  configuration:
    mapUnderscoreToCamelCase: true # 库下划线字段 ↔ 实体驼峰属性自动映射
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto                 # 主键自增（物理主键均 AUTO_INCREMENT）
      logic-delete-field: none      # 本项目未设计逻辑删除字段，不启用